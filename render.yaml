services:
  - type: web
    name: alpha-edu-hub
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME
        sync: false

databases:
  - name: alpha-edu-hub-db
    databaseName: alpha_edu_hub
    user: alpha_edu_user
    plan: free